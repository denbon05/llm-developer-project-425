# Application stack — GreenMail, helpdesk Postgres, ticketing, email-gateway.
# Joins helpdesk_private created by the Dify stack (start Dify first).
# Variable values come from `.env` (see `.env.example`); no :- fallbacks here.

name: helpdesk-app

services:
  # Synthetic IMAP/SMTP/API mail server for local Phase 2+ email tests.
  greenmail:
    image: greenmail/standalone:2.1.11
    restart: unless-stopped
    environment:
      # Users: support@example.test / support-pass, employee@example.test / employee-pass
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=support:support-pass@example.test,employee:employee-pass@example.test
        -Dgreenmail.verbose
    # Loopback-only publish for local IMAP/SMTP/API tests (SEC-7).
    ports:
      - "127.0.0.1:${GREENMAIL_SMTP_PORT}:3025"
      - "127.0.0.1:${GREENMAIL_IMAP_PORT}:3143"
      - "127.0.0.1:${GREENMAIL_API_PORT}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1:8080;
          printf "GET /api/service/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          IFS=" " read -r _ status _ <&3;
          test "$$status" = 200'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - default
      - helpdesk_private

  helpdesk-db:
    image: postgres:15.13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HELPDESK_DB_USER}
      POSTGRES_PASSWORD: ${HELPDESK_DB_PASSWORD}
      POSTGRES_DB: ${HELPDESK_DB_NAME}
    # Loopback publish for host tools against compose DB.
    ports:
      - "127.0.0.1:${HELPDESK_DB_PORT}:5432"
    volumes:
      - helpdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${HELPDESK_DB_USER} -d ${HELPDESK_DB_NAME}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - default
      - helpdesk_private

  ticketing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # From Make (`.python-version`) or the environment; no silent pin here.
        PYTHON_VERSION: ${PYTHON_VERSION}
    restart: unless-stopped
    environment:
      # In-network DSN (host `.env` DATABASE_URL stays on localhost for tools).
      DATABASE_URL: postgresql+psycopg://${HELPDESK_DB_USER}:${HELPDESK_DB_PASSWORD}@helpdesk-db:5432/${HELPDESK_DB_NAME}
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "ticketing.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--reload",
        "--reload-dir",
        "/app/src",
      ]
    ports:
      - "127.0.0.1:${TICKETING_PORT}:8080"
    volumes:
      - ./src:/app/src
    depends_on:
      helpdesk-db:
        condition: service_healthy
    networks:
      - default
      - helpdesk_private

  email-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    restart: unless-stopped
    environment:
      IMAP_HOST: greenmail
      IMAP_PORT: "3143"
      SMTP_HOST: greenmail
      SMTP_PORT: "3025"
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_POLL_INTERVAL_SECONDS: ${EMAIL_POLL_INTERVAL_SECONDS}
      DIFY_WORKFLOW_URL: http://nginx:80/v1/workflows/run
      DIFY_EMAIL_HELPDESK_API_KEY: ${DIFY_EMAIL_HELPDESK_API_KEY}
      CITATION_REPO_BASE: ${CITATION_REPO_BASE}
    command: ["uv", "run", "email-gateway"]
    volumes:
      - ./src:/app/src
    depends_on:
      greenmail:
        condition: service_healthy
    networks:
      - default
      - helpdesk_private

volumes:
  helpdesk_pgdata:

networks:
  default:
    name: helpdesk-app_default
  helpdesk_private:
    name: helpdesk_private
    external: true
