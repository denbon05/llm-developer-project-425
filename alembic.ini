[alembic]
# Migration scripts live here; env.py supplies DB URL from Settings.
script_location = src/ticketing/migrations
prepend_sys_path = .
version_path_separator = os

# --- logging (used by fileConfig in migrations/env.py) ---
[loggers]
# Named loggers defined below.
keys = root,sqlalchemy,alembic

[handlers]
# Output sinks; "console" = stderr.
keys = console

[formatters]
keys = generic

[logger_root]
# Default level for anything not overridden below.
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
# Keep SQL echo quiet unless debugging (set to INFO).
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# Show migration progress (upgrade/downgrade lines).
level = INFO
handlers =
qualname = alembic

[handler_console]
# Empty handlers= above → child loggers bubble to this root handler.
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
