[project]
name = "llm-developer-project-425"
version = "0.1.0"
description = "Email help-desk assistant for employees"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "mcp>=1.9",
    "httpx>=0.28",
    "greenlet>=3.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "testcontainers[postgres]>=4.9",
]

[project.scripts]
ticketing = "ticketing.main:main"
email-gateway = "email_gateway.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/contracts",
    "src/privacy",
    "src/ticketing",
    "src/email_gateway",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fresh asyncio event loop for every test function.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
# Black-compatible: multiline calls/collections keep a trailing comma.
# Do not enable lint COM812 — it fights the formatter.
skip-magic-trailing-comma = false
quote-style = "double"
indent-style = "space"
