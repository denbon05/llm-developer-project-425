# Dify platform stack — self-hosted Dify, its PostgreSQL, persistent Weaviate,
# and resource-limited Ollama on the private shared network (Phase 2).
#
# Pins: Dify 1.16.1 (api/web), Weaviate 1.27.0, Ollama 0.11.4, sandbox 0.2.15,
# plugin-daemon 0.6.3-local. Ticket PostgreSQL is NOT in this project.
# Owns named network helpdesk_private (start this stack before the app stack).
#
# Env wiring (two different steps — do not collapse them):
# 1) Project `.env` (via CLI `--env-file dify/.env`) feeds
#    Compose ${VAR} interpolation when parsing this file (ports, passwords in
#    environment:/command, etc.). Service env_file does NOT do that.
# 2) x-dify-env / env_file injects the full `.env` into selected containers
#    (api/worker need many keys not listed under environment:).
# Squid template ${VAR} expansion is container-side (entrypoint) — unrelated to (1).
# Nginx uses static conf files (no envsubst).

name: helpdesk-dify

# Container injection only; see header for interpolation vs env_file.
x-dify-env: &dify-env
  env_file:
    - .env

services:
  # One-shot chown of shared app storage for the API/worker UID.
  init_permissions:
    image: busybox:1.37.0
    command:
      - sh
      - -c
      - |
        FLAG_FILE="/app/api/storage/.init_permissions"
        if [ -f "$${FLAG_FILE}" ]; then
          echo "Permissions already initialized. Exiting."
          exit 0
        fi
        echo "Initializing permissions for /app/api/storage"
        chown -R 1001:1001 /app/api/storage && touch "$${FLAG_FILE}"
        echo "Permissions initialized. Exiting."
    volumes:
      - dify_app_storage:/app/api/storage
    restart: "no"
    networks:
      - default

  # Dify HTTP API (console + service APIs behind nginx).
  api:
    <<: *dify-env
    image: langgenius/dify-api:1.16.1
    restart: unless-stopped
    environment:
      MODE: api
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dify_app_storage:/app/api/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
      - ssrf_proxy_network
      - helpdesk_private

  # Celery worker for async Dify jobs (indexing, workflow tasks).
  worker:
    <<: *dify-env
    image: langgenius/dify-api:1.16.1
    restart: unless-stopped
    environment:
      MODE: worker
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dify_app_storage:/app/api/storage
    networks:
      - default
      - ssrf_proxy_network
      - helpdesk_private

  # Celery beat is unused.

  # Dify Studio / console web UI (proxied by nginx).
  web:
    <<: *dify-env
    image: langgenius/dify-web:1.16.1
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: ${CONSOLE_API_URL:-}
      SERVER_CONSOLE_API_URL: ${SERVER_CONSOLE_API_URL:-http://api:5001}
      APP_API_URL: ${APP_API_URL:-}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-ws://127.0.0.1:13080}
      MARKETPLACE_API_URL: ${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
      MARKETPLACE_URL: ${MARKETPLACE_URL:-https://marketplace.dify.ai}
    networks:
      - default

  # Dify-owned PostgreSQL only (not ticket DB).
  db_postgres:
    image: postgres:15.13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dify_postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - default
    # No host ports: Dify DB stays on the private container network only.

  # Broker/cache for API and Celery worker.
  redis:
    image: redis:6.2.20-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - dify_redis_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - default

  # Isolated code-execution sandbox (egress via ssrf_proxy).
  sandbox:
    <<: *dify-env
    image: langgenius/dify-sandbox:0.2.15
    restart: unless-stopped
    environment:
      API_KEY: ${SANDBOX_API_KEY}
      GIN_MODE: release
      WORKER_TIMEOUT: ${SANDBOX_WORKER_TIMEOUT:-15}
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://ssrf_proxy:3128
      HTTPS_PROXY: http://ssrf_proxy:3128
      SANDBOX_PORT: 8194
    volumes:
      - ./volumes/sandbox/dependencies:/dependencies
      - ./volumes/sandbox/conf:/conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ssrf_proxy_network

  # Plugin marketplace / local plugin runtime.
  plugin_daemon:
    <<: *dify-env
    image: langgenius/dify-plugin-daemon:0.6.3-local
    restart: unless-stopped
    environment:
      DB_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
      SERVER_PORT: ${PLUGIN_DAEMON_PORT:-5002}
      SERVER_KEY: ${PLUGIN_DAEMON_KEY}
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: ${PLUGIN_DEBUGGING_PORT:-5003}
      PLUGIN_WORKING_PATH: /app/storage/cwd
      FORCE_VERIFYING_SIGNATURE: ${FORCE_VERIFYING_SIGNATURE:-true}
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
    volumes:
      - dify_plugin_storage:/app/storage
    depends_on:
      db_postgres:
        condition: service_healthy
    # Debugging port bound to loopback only (local admin tooling).
    ports:
      - "127.0.0.1:${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}:${PLUGIN_DEBUGGING_PORT:-5003}"
    # helpdesk_private: Studio MCP must resolve ticketing (not localhost).
    networks:
      - default
      - ssrf_proxy_network
      - helpdesk_private

  # Squid egress proxy for sandbox/plugin SSRF controls.
  ssrf_proxy:
    image: ubuntu/squid:6.6-24.04_beta
    restart: unless-stopped
    volumes:
      - ./ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template:ro
      - ./ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template:ro
      - ./ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    environment:
      HTTP_PORT: 3128
      COREDUMP_DIR: /var/spool/squid
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ${SSRF_PROXY_ALLOW_PRIVATE_IPS:-}
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: ${SSRF_PROXY_ALLOW_PRIVATE_DOMAINS:-}
    # helpdesk_private: Squid can reach allowlisted ticketing only.
    networks:
      - ssrf_proxy_network
      - default
      - helpdesk_private

  # Loopback-only HTTP reverse proxy to web + api (no TLS in Phase 2).
  nginx:
    image: nginx:1.27.5
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params_dify:/etc/nginx/proxy_params_dify:ro
    depends_on:
      - api
      - web
    # Admin UI only on loopback for local one-time setup (FR-10 / SEC-7).
    ports:
      - "127.0.0.1:${EXPOSE_NGINX_PORT:-13080}:80"
    networks:
      - default
      - helpdesk_private

  # Persistent vector store for Dify knowledge (private; no host ports).
  weaviate:
    image: semitechnologies/weaviate:1.27.0
    restart: unless-stopped
    volumes:
      - dify_weaviate_data:/var/lib/weaviate
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY}
      AUTHENTICATION_APIKEY_USERS: hello@dify.ai
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: hello@dify.ai
      DISABLE_TELEMETRY: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # No host ports: vector store is private to the Dify stack.
    networks:
      - default
      - helpdesk_private

  # Internal local embedding host (model loaded by ollama-pull).
  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - dify_ollama_data:/root/.ollama
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - default
      - helpdesk_private

  # One-shot on compose up: pull the model via the Ollama API into
  # dify_ollama_data. Idempotent after the first success. Do not block
  # api/worker on this.
  ollama-pull:
    image: ollama/ollama:0.11.4
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_EMBEDDING_MODEL}"]
    networks:
      - default

networks:
  default:
    name: helpdesk-dify_default
  ssrf_proxy_network:
    name: helpdesk-dify_ssrf
    internal: true
  # Shared private LAN between Dify and application stacks; this project creates it.
  helpdesk_private:
    name: helpdesk_private

volumes:
  dify_postgres_data:
    name: helpdesk_dify_postgres_data
  dify_weaviate_data:
    name: helpdesk_dify_weaviate_data
  dify_redis_data:
    name: helpdesk_dify_redis_data
  dify_app_storage:
    name: helpdesk_dify_app_storage
  dify_plugin_storage:
    name: helpdesk_dify_plugin_storage
  dify_ollama_data:
    name: helpdesk_dify_ollama_data
